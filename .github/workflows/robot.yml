name: Container Build Pipeline
on: [push]
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download the code to the robot's temporary server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build the Docker image exactly like a human would
      - name: Build Docker Container
        run: |
          cd challenge-web
          docker build -t automated-challenge:v1 .